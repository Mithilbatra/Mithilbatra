name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7aa2f7&color_dots=#ebedf0,#c6d4fb,#9db6f9,#7aa2f7,#bb9af7
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff007c&color_dots=#161b22,#2f334d,#3d59a1,#7aa2f7,#bb9af7

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
