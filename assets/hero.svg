.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.star circle { animation: twinkle 3s ease-in-out infinite alternate; } @keyframes twinkle { from { opacity: .15; } }.hl { animation: hl 3.0s cubic-bezier(.55,0,1,.45) infinite; }@keyframes hl { from { transform: translateY(0); opacity: 0; } 25% { opacity: .9; } to { transform: translateY(120px); opacity: 1; } }
.name { font-size: 92px; font-weight: 800; letter-spacing: 6px; }
