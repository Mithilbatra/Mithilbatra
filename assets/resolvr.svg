<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" role="img" aria-label="Resolvr: an incident moving from triggered to resolved on a Kanban board">
<title>Resolvr: an incident moving from triggered to resolved on a Kanban board</title>
<defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b26"/><stop offset="1" stop-color="#16161e"/></linearGradient><clipPath id="frame"><rect width="820" height="200" rx="16"/></clipPath><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3b4261"/></pattern><radialGradient id="spot" cx="0" cy="0" r="1"><stop offset="0" stop-color="#bb9af7" stop-opacity=".18"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient><linearGradient id="rsG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7768e"/><stop offset="1" stop-color="#bb9af7"/></linearGradient></defs>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

.title { font-size: 44px; font-weight: 900; font-style: italic; letter-spacing: 1px; }
.sub { font-size: 12px; fill: #9aa5ce; letter-spacing: 1px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
.blink { animation: blink 1.2s ease-in-out infinite alternate; }
@keyframes blink { from { opacity: .2; } }

.state { animation: state 8s steps(1) infinite; }
@keyframes state { 0% { opacity: 1; } 25%, 100% { opacity: 0; } }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
.card { transform: translateX(300px); animation: move 8s ease-in-out infinite; }
@keyframes move { 0%, 22% { transform: translateX(0); opacity: 1; } 27%, 72% { transform: translateX(150px); } 77%, 94% { transform: translateX(300px); opacity: 1; } 97% { transform: translateX(300px); opacity: 0; } 98% { transform: translateX(0); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
.sev { fill: #9ece6a; animation: sev 8s steps(1) infinite; }
@keyframes sev { 0% { fill: #f7768e; } 25% { fill: #e0af68; } 50% { fill: #ff9e64; } 75% { fill: #9ece6a; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)"><rect width="820" height="200" fill="url(#bannerBg)"/><rect width="820" height="200" fill="url(#dots)" opacity=".35"/><rect width="820" height="200" fill="url(#spot)"/>
<circle class="ping" cx="44" cy="44" r="6" fill="none" stroke="#f7768e" stroke-width="2"/>
<circle class="ping" cx="44" cy="44" r="6" fill="none" stroke="#f7768e" stroke-width="2" style="animation-delay:1s"/>
<circle cx="44" cy="44" r="6" fill="#f7768e" filter="url(#glow)"/>
<text x="72" y="49" class="mono tag" fill="#f7768e">ON-CALL · PAGING</text>
<text x="32" y="106" class="title" fill="url(#rsG)" filter="url(#glow)">RESOLVR</text>
<text x="32" y="132" class="mono sub">INCIDENTS · ON-CALL · ESCALATION</text>
<g class="state" style="animation-delay:-8s;opacity:0"><rect x="32" y="150" width="150" height="26" rx="13" fill="#f7768e" fill-opacity=".15" stroke="#f7768e"/><circle cx="48" cy="163" r="4" fill="#f7768e"/><text x="60" y="167" class="mono tag" fill="#f7768e">TRIGGERED</text></g><g class="state" style="animation-delay:-6s;opacity:0"><rect x="32" y="150" width="150" height="26" rx="13" fill="#e0af68" fill-opacity=".15" stroke="#e0af68"/><circle cx="48" cy="163" r="4" fill="#e0af68"/><text x="60" y="167" class="mono tag" fill="#e0af68">ACKNOWLEDGED</text></g><g class="state" style="animation-delay:-4s;opacity:0"><rect x="32" y="150" width="150" height="26" rx="13" fill="#ff9e64" fill-opacity=".15" stroke="#ff9e64"/><circle cx="48" cy="163" r="4" fill="#ff9e64"/><text x="60" y="167" class="mono tag" fill="#ff9e64">ESCALATED</text></g><g class="state" style="animation-delay:-2s;opacity:1"><rect x="32" y="150" width="150" height="26" rx="13" fill="#9ece6a" fill-opacity=".15" stroke="#9ece6a"/><circle cx="48" cy="163" r="4" fill="#9ece6a"/><text x="60" y="167" class="mono tag" fill="#9ece6a">RESOLVED</text></g>
<text x="360" y="40" class="mono tag" fill="#9aa5ce">OPEN</text><rect x="360" y="50" width="136" height="132" rx="10" fill="#16161e" stroke="#2f334d"/><rect x="368" y="60" width="120" height="48" rx="6" fill="#24283b" opacity=".45"/><text x="510" y="40" class="mono tag" fill="#9aa5ce">IN PROGRESS</text><rect x="510" y="50" width="136" height="132" rx="10" fill="#16161e" stroke="#2f334d"/><rect x="518" y="128" width="120" height="48" rx="6" fill="#24283b" opacity=".45"/><text x="660" y="40" class="mono tag" fill="#9aa5ce">RESOLVED</text><rect x="660" y="50" width="136" height="132" rx="10" fill="#16161e" stroke="#2f334d"/><rect x="668" y="60" width="120" height="48" rx="6" fill="#24283b" opacity=".45"/>
<g class="card">
  <rect x="368" y="94" width="120" height="58" rx="6" fill="#24283b" stroke="#3b4261"/>
  <rect class="sev" x="368" y="94" width="4" height="58" rx="2"/>
  <text x="380" y="112" class="mono tag" fill="#c0caf5">INC-1042</text>
  <text x="380" y="128" class="mono" font-size="10" fill="#9aa5ce">checkout 5xx spike</text>
  <rect class="sev" x="380" y="136" width="34" height="10" rx="5" opacity=".8"/>
</g></g><rect x="1" y="1" width="818" height="198" rx="16" fill="none" stroke="#2f334d" stroke-width="2"/>
</svg>
