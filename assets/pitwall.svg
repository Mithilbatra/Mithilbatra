<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" role="img" aria-label="Pit Wall: F1 podium prediction and live timing dashboard">
<title>Pit Wall: F1 podium prediction and live timing dashboard</title>
<defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b26"/><stop offset="1" stop-color="#16161e"/></linearGradient><clipPath id="frame"><rect width="820" height="200" rx="16"/></clipPath><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3b4261"/></pattern><radialGradient id="spot" cx="0" cy="0" r="1"><stop offset="0" stop-color="#f7768e" stop-opacity=".18"/><stop offset="1" stop-color="#f7768e" stop-opacity="0"/></radialGradient><linearGradient id="pwG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7768e"/><stop offset="1" stop-color="#ff9e64"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter></defs>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

.title { font-size: 44px; font-weight: 900; font-style: italic; letter-spacing: 1px; }
.sub { font-size: 12px; fill: #9aa5ce; letter-spacing: 1px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
.blink { animation: blink 1.2s ease-in-out infinite alternate; }
@keyframes blink { from { opacity: .2; } }

.grow { transform-box: fill-box; transform-origin: left center; animation: grow 6s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes grow { 0% { transform: scaleX(0); } 30%, 100% { transform: scaleX(1); } }
.sector { fill: #bb9af7; animation: sector 3.9s steps(1) infinite; }
@keyframes sector { 0% { fill: #e0af68; } 33% { fill: #9ece6a; } 66% { fill: #bb9af7; } }
.lap { stroke-dasharray: 8 92; animation: lap 4s linear infinite; }
@keyframes lap { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)"><rect width="820" height="200" fill="url(#bannerBg)"/><rect width="820" height="200" fill="url(#dots)" opacity=".35"/><rect width="820" height="200" fill="url(#spot)"/>
<rect x="32" y="30" width="66" height="22" rx="11" fill="#f7768e" fill-opacity=".15" stroke="#f7768e"/>
<circle class="blink" cx="45" cy="41" r="4" fill="#f7768e"/><text x="55" y="45" class="mono tag" fill="#f7768e">LIVE</text>
<text x="32" y="104" class="title" fill="url(#pwG)" filter="url(#glow)">PIT WALL</text>
<text x="32" y="130" class="mono sub">F1 PODIUM PREDICTION · FASTF1 TELEMETRY</text>
<rect class="sector" x="32" y="150" width="86" height="26" rx="5" style="animation-delay:-0.0s"/><text x="75" y="167" text-anchor="middle" class="mono tag" fill="#1a1b26">S1</text><rect class="sector" x="124" y="150" width="86" height="26" rx="5" style="animation-delay:-1.3s"/><text x="167" y="167" text-anchor="middle" class="mono tag" fill="#1a1b26">S2</text><rect class="sector" x="216" y="150" width="86" height="26" rx="5" style="animation-delay:-2.6s"/><text x="259" y="167" text-anchor="middle" class="mono tag" fill="#1a1b26">S3</text>
<text x="380" y="50" class="mono tag" fill="#9aa5ce">PODIUM CONFIDENCE</text>
<text x="380" y="81" class="mono tag" fill="#c0caf5">P1</text><rect x="410" y="70" width="150" height="14" rx="7" fill="#24283b"/><rect class="grow" x="410" y="70" width="132" height="14" rx="7" fill="#e0af68" style="animation-delay:0.3s"/><text x="380" y="113" class="mono tag" fill="#c0caf5">P2</text><rect x="410" y="102" width="150" height="14" rx="7" fill="#24283b"/><rect class="grow" x="410" y="102" width="105" height="14" rx="7" fill="#c0caf5" style="animation-delay:0.5s"/><text x="380" y="145" class="mono tag" fill="#c0caf5">P3</text><rect x="410" y="134" width="150" height="14" rx="7" fill="#24283b"/><rect class="grow" x="410" y="134" width="81" height="14" rx="7" fill="#ff9e64" style="animation-delay:0.7s"/>
<text x="612" y="34" class="mono tag" fill="#9aa5ce">LIVE TIMING</text>
<path d="M612 150C604 118 612 84 640 70L700 46C722 38 748 44 760 62C772 80 766 98 748 104L716 114C704 118 706 132 718 136L770 150C790 156 788 178 766 178L632 178C618 178 614 164 612 150Z" fill="none" stroke="#2f334d" stroke-width="11" stroke-linejoin="round"/>
<path d="M612 150C604 118 612 84 640 70L700 46C722 38 748 44 760 62C772 80 766 98 748 104L716 114C704 118 706 132 718 136L770 150C790 156 788 178 766 178L632 178C618 178 614 164 612 150Z" fill="none" stroke="#3b4261" stroke-width="1" stroke-dasharray="4 6"/>
<line x1="602" y1="146" x2="622" y2="146" stroke="#c0caf5" stroke-width="3"/>
<path class="lap" d="M612 150C604 118 612 84 640 70L700 46C722 38 748 44 760 62C772 80 766 98 748 104L716 114C704 118 706 132 718 136L770 150C790 156 788 178 766 178L632 178C618 178 614 164 612 150Z" pathLength="100" fill="none" stroke="#ff9e64" stroke-width="10" opacity=".5" filter="url(#blur)" style="stroke-dasharray:14 86"/>
<path class="lap" d="M612 150C604 118 612 84 640 70L700 46C722 38 748 44 760 62C772 80 766 98 748 104L716 114C704 118 706 132 718 136L770 150C790 156 788 178 766 178L632 178C618 178 614 164 612 150Z" pathLength="100" fill="none" stroke="#f7768e" stroke-width="5" stroke-linecap="round"/></g><rect x="1" y="1" width="818" height="198" rx="16" fill="none" stroke="#2f334d" stroke-width="2"/>
</svg>
