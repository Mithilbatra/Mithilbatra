 style="animation-duration:0.56s;animation-delay:-0.86s"/><rect x="260" y="153" width="6" height="29" rx="3" style="animation-duration:1.04s;animation-delay:-0.57s"/><rect x="272" y="158" width="6" height="24" rx="3" style="animation-duration:0.59s;animation-delay:-0.83s"/><rect x="284" y="161" width="6" height="21" rx="3" style="animation-duration:0.64s;animation-delay:-0.06s"/><rect x="296" y="155" width="6" height="27" rx="3" style="animation-duration:1.09s;animation-delay:-0.09s"/><rect x="308" y="156" width="6" height="26" rx="3" style="animation-duration:0.72s;animation-delay:-0.15s"/></g>
<g class="q">
  <circle cx="378" cy="54" r="12" fill="#bb9af7" fill-opacity=".25" stroke="#bb9af7"/><text x="378" y="58" text-anchor="middle" class="mono tag" fill="#bb9af7">AI</text>
  <rect x="398" y="36" width="320" height="36" rx="10" fill="#24283b"/>
  <text x="412" y="59" class="mono" font-size="12" fill="#c0caf5">Walk me through a system you designed.</text>
</g>
<g class="bubble">
  <rect x="436" y="90" width="354" height="36" rx="10" fill="#7aa2f7" fill-opacity=".14" stroke="#7aa2f7" stroke-opacity=".6"/>
  <g class="typing"><circle class="bounce" cx="742" cy="108" r="3.5" fill="#7aa2f7" style="animation-delay:0.00s"/><circle class="bounce" cx="754" cy="108" r="3.5" fill="#7aa2f7" style="animation-delay:0.15s"/><circle class="bounce" cx="766" cy="108" r="3.5" fill="#7aa2f7" style="animation-delay:0.30s"/></g>
  <text class="ans mono" x="450" y="113" font-size="12" fill="#c0caf5">Sure, I built Resolvr, an incident platform…</text>
</g>
<g class="fb">
  <rect x="398" y="140" width="392" height="44" rx="10" fill="#9ece6a" fill-opacity=".08" stroke="#9ece6a" stroke-opacity=".5"/>
  <circle cx="420" cy="162" r="11" fill="#9ece6a" fill-opacity=".2" stroke="#9ece6a"/>
  <path d="M415 162l4 4 7-8" fill="none" stroke="#9ece6a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="158" class="mono tag" fill="#9ece6a">FEEDBACK READY</text>
  <text x="440" y="174" class="mono" font-size="11" fill="#9aa5ce">clarity · depth · structure</text>
  <circle cx="760" cy="162" r="14" fill="none" stroke="#24283b" stroke-width="4"/>
  <circle class="ring" cx="760" cy="162" r="14" fill="none" stroke="#9ece6a" stroke-width="4" stroke-linecap="round" transform="rotate(-90 760 162)"/>
</g></g><rect x="1" y="1" width="818" height="198" rx="16" fill="none" stroke="#2f334d" stroke-width="2"/>
</svg>
