<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" role="img" aria-label="AI Mock Interviewer: an AI question, a spoken answer and generated feedback">
<title>AI Mock Interviewer: an AI question, a spoken answer and generated feedback</title>
<defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b26"/><stop offset="1" stop-color="#16161e"/></linearGradient><clipPath id="frame"><rect width="820" height="200" rx="16"/></clipPath><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3b4261"/></pattern><radialGradient id="spot" cx="0" cy="0" r="1"><stop offset="0" stop-color="#9ece6a" stop-opacity=".18"/><stop offset="1" stop-color="#9ece6a" stop-opacity="0"/></radialGradient><linearGradient id="aiG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ece6a"/><stop offset="1" stop-color="#7dcfff"/></linearGradient><linearGradient id="eqG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ece6a"/><stop offset="1" stop-color="#7dcfff"/></linearGradient></defs>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

.title { font-size: 44px; font-weight: 900; font-style: italic; letter-spacing: 1px; }
.sub { font-size: 12px; fill: #9aa5ce; letter-spacing: 1px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
.blink { animation: blink 1.2s ease-in-out infinite alternate; }
@keyframes blink { from { opacity: .2; } }

.eq rect { fill: url(#eqG); transform-box: fill-box; transform-origin: center bottom; animation: eq .8s ease-in-out infinite alternate; }
@keyframes eq { from { transform: scaleY(.2); } }
.q { animation: q 9s ease-out infinite; }
@keyframes q { 0% { opacity: 0; transform: translateY(8px); } 6%, 92% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
.bubble { animation: bubble 9s ease-out infinite; }
@keyframes bubble { 0%, 11% { opacity: 0; transform: translateY(8px); } 15%, 92% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
.typing { opacity: 0; animation: typing 9s steps(1) infinite; }
@keyframes typing { 0% { opacity: 0; } 15% { opacity: 1; } 36%, 100% { opacity: 0; } }
.bounce { animation: bounce .6s ease-in-out infinite alternate; }
@keyframes bounce { to { transform: translateY(-4px); } }
.ans { animation: ans 9s ease-out infinite; }
@keyframes ans { 0%, 36% { opacity: 0; } 40%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
.fb { animation: fb 9s ease-out infinite; }
@keyframes fb { 0%, 48% { opacity: 0; transform: translateY(8px); } 53%, 92% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
.ring { stroke-dasharray: 87.96; stroke-dashoffset: 10.6; animation: ring 9s ease-out infinite; }
@keyframes ring { 0%, 52% { stroke-dashoffset: 87.96; } 72%, 100% { stroke-dashoffset: 10.6; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)"><rect width="820" height="200" fill="url(#bannerBg)"/><rect width="820" height="200" fill="url(#dots)" opacity=".35"/><rect width="820" height="200" fill="url(#spot)"/>
<rect x="32" y="30" width="58" height="22" rx="11" fill="#f7768e" fill-opacity=".15" stroke="#f7768e"/>
<circle class="blink" cx="45" cy="41" r="4" fill="#f7768e"/><text x="55" y="45" class="mono tag" fill="#f7768e">REC</text>
<rect x="98" y="30" width="80" height="22" rx="11" fill="#bb9af7" fill-opacity=".15" stroke="#bb9af7"/>
<text x="138" y="45" text-anchor="middle" class="mono tag" fill="#bb9af7">GEMINI</text>
<text x="32" y="104" class="title" fill="url(#aiG)" filter="url(#glow)" style="font-size:38px">AI INTERVIEWER</text>
<text x="32" y="130" class="mono sub">ROLE-AWARE QUESTIONS · AI FEEDBACK</text>
