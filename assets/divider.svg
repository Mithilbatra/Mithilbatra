<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Section divider">
<title>Section divider</title>
<defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f700"/><stop offset="0.2" stop-color="#7aa2f7"/><stop offset="0.5" stop-color="#bb9af7"/><stop offset="0.8" stop-color="#ff007c"/><stop offset="1" stop-color="#ff007c00"/></linearGradient><linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dcfff00"/><stop offset="0.5" stop-color="#7dcfff"/><stop offset="1" stop-color="#7dcfff00"/></linearGradient></defs>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

.pulse { opacity: 0; animation: sweep 5s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes sweep { 0% { opacity: 0; transform: translateX(-220px); } 12%, 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(1200px); } }
.gem { transform-box: fill-box; transform-origin: center; animation: gem 2.5s ease-in-out infinite alternate; }
@keyframes gem { from { opacity: .45; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0" y="13.25" width="1200" height="1.5" fill="url(#line)" opacity=".8"/>
<g class="pulse"><rect x="0" y="11" width="220" height="6" fill="url(#pulse)" filter="url(#blur)"/><rect x="0" y="13" width="220" height="2" fill="url(#pulse)"/></g>
<rect class="gem" x="595.0" y="9" width="10" height="10" fill="#1a1b26" stroke="#bb9af7" stroke-width="1.5" transform="rotate(45 600.0 14)" filter="url(#glow)"/>
</svg>
