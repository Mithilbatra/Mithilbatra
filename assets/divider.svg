<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="Divider: an F1 car racing along a kerb">
<title>Divider: an F1 car racing along a kerb</title>
<defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset="0.1" stop-color="#fff"/><stop offset="0.9" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient><mask id="ends"><rect width="1200" height="64" fill="url(#fade)"/></mask><linearGradient id="carG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bb9af7"/><stop offset="1" stop-color="#7aa2f7"/></linearGradient><linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f700"/><stop offset="1" stop-color="#7aa2f7"/></linearGradient></defs>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

.car { transform: translate(530px, 16px); animation: drive 6s cubic-bezier(.6,0,.4,1) infinite; }
@keyframes drive { 0% { transform: translate(-200px, 16px); } 55%, 100% { transform: translate(1260px, 16px); } }
.wheel { transform-box: fill-box; transform-origin: center; animation: spin .25s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.speed { animation: flicker .18s steps(2) infinite; }
@keyframes flicker { 50% { opacity: .35; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
